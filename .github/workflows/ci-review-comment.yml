name: CI review comment

# Live-updating PR review comment. This workflow always reads its executable
# code from the trusted default branch. The fork keeps it opt-in because the
# poller can otherwise occupy a runner for the full duration of every CI run.

on:
  workflow_run:
    workflows: [CI]
    types: [in_progress]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ci-review-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: CI review comment (live)
    # Repository owners may opt in with the CI_LIVE_COMMENT_ENABLED Actions
    # variable. Fork PRs never receive a write token or a comment run.
    if: >-
      vars.CI_LIVE_COMMENT_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run live comment poller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          WATCH_WORKFLOWS: |
            Docker Build, Test, and Publish
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          python3 -u scripts/ci/live_comment.py \
            --interval 15 \
            --timeout 3000
